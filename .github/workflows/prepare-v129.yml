name: Prepare test version 1.11.129
on:
  push:
    branches: [feat/mouvement-depuis-position]
    paths: [.github/workflows/prepare-v129.yml]
permissions:
  contents: write
jobs:
  version:
    if: github.repository == 'julienluigi/Patrimoine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mouvement-depuis-position
      - name: Update application and cache versions only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          updates = [
              ('mon-patrimoine.js', "const APP_VERSION = '1.11.128';", "const APP_VERSION = '1.11.129';"),
              ('sw.js', "const CACHE = 'patrimoine-v128';", "const CACHE = 'patrimoine-v129';"),
          ]
          prepared = []
          for filename, old, new in updates:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if text.count(new) == 1 and old not in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit('Unexpected version in ' + filename)
              prepared.append((p, text.replace(old, new, 1)))
          for p, text in prepared:
              p.write_text(text, encoding='utf-8')
          PY
          node --check mon-patrimoine.js
          node --check sw.js
          node --check js/core/screens.js
          node --check js/screens/dashboard.js
      - name: Commit version bump to the fork branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mon-patrimoine.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Version 1.11.129 (cache v129) pour tests immobilier et patrimoine'
            git push origin HEAD:refs/heads/feat/mouvement-depuis-position
          fi
